[project]
name = "aiogram-kit-workspace"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
aiogram-kit = { workspace = true }
aiogram-coordination = { workspace = true }
aiogram-sentinel = { workspace = true }
aiogram-cmds = { workspace = true }
aiogram-nav = { workspace = true }
aiogram-idle = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pyyaml>=6"]

[tool.pytest.ini_options]
testpaths = ["tests/integration"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
