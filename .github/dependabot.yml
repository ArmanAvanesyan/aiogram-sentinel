  open-pull-requests-limit: 2
- package-ecosystem: cargo
  directory: /packages/aiogram-cmds/native
  schedule:
    interval: weekly
  open-pull-requests-limit: 2
- package-ecosystem: cargo
  directory: /packages/aiogram-nav/native
  schedule:
    interval: weekly
  open-pull-requests-limit: 2
- package-ecosystem: cargo
  directory: /packages/aiogram-idle/native
  schedule:
    interval: weekly
  open-pull-requests-limit: 2
