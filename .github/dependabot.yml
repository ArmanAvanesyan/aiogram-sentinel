version: 2
updates:
- package-ecosystem: uv
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 2
  groups:
    compatible-updates:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  ignore:
  - dependency-name: '*'
    update-types:
    - version-update:semver-major
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 2
  groups:
    compatible-updates:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  ignore:
  - dependency-name: '*'
    update-types:
    - version-update:semver-major
