name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen --all-extras
      - name: Validate package version against the release tag
        run: uv run --no-sync python tools/check_version_tag.py
      - run: uv build
      - run: uv run --no-sync python -m twine check dist/*
      - name: Publish the explicitly tagged release
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Attach artifacts and generated release notes
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
