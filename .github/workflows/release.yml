name: Publish verified release

on:
  workflow_dispatch:
    inputs:
      manifest_sha256:
        description: SHA256 of the independently verified GitHub release SHA256SUMS
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - name: Download the exact reviewed release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --pattern '*.whl' --pattern '*.tar.gz' --pattern SHA256SUMS --dir dist
      - name: Validate tag, distribution names and independently supplied checksums
        env:
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          python - <<'PYVERIFY'
          import hashlib
          import os
          import re
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          version = project['version']
          if os.environ['GITHUB_REF_NAME'] != 'v' + version:
              raise SystemExit('Tag does not match project version')
          expected_digest = os.environ['MANIFEST_SHA256']
          if not re.fullmatch(r'[a-f0-9]{64}', expected_digest):
              raise SystemExit('Expected an independently verified SHA256 digest')
          manifest = Path('dist/SHA256SUMS')
          if hashlib.sha256(manifest.read_bytes()).hexdigest() != expected_digest:
              raise SystemExit('Release checksum manifest differs from reviewed input')
          name = project['name'].replace('-', '_')
          expected = {f'{name}-{version}-py3-none-any.whl', f'{name}-{version}.tar.gz'}
          if {p.name for p in Path('dist').iterdir()} != expected | {'SHA256SUMS'}:
              raise SystemExit('Unexpected release files')
          checked = set()
          for line in manifest.read_text().splitlines():
              digest, filename = line.split()
              if filename not in expected or filename in checked:
                  raise SystemExit('Unexpected or repeated checksum entry')
              if hashlib.sha256((Path('dist') / filename).read_bytes()).hexdigest() != digest:
                  raise SystemExit('Distribution checksum mismatch')
              checked.add(filename)
          if checked != expected:
              raise SystemExit('Missing distribution checksum')
          PYVERIFY
      - run: uvx twine check dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: verified-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: verified-distributions
          path: dist
      - name: Publish verified distributions using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
