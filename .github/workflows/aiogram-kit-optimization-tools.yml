# Generated by tools/port_ci.py; package originals remain preservation inputs.
name: 'aiogram-kit: Optimization tooling'
permissions:
  contents: read
concurrency:
  group: aiogram-kit-optimization-tools-optimization-tools-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
        - '3.10'
        - '3.12'
        - '3.14'
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
        path: monorepo-source
    - name: Stage isolated distribution checkout
      working-directory: ${{ github.workspace }}
      shell: bash
      run: 'mkdir -p "${GITHUB_WORKSPACE}"

        cp -a "$GITHUB_WORKSPACE/monorepo-source/packages/aiogram-kit/." "${GITHUB_WORKSPACE}/"'
    - uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python }}
    - name: Verify evidence and instrumentation guards
      run: uv run --no-project --python '${{ matrix.python }}' --with 'pytest>=8,<10' --with 'pytest-asyncio>=0.26,<2' --with
        'redis>=5,<8' --with 'tomli>=2,<3' pytest -q -o asyncio_default_fixture_loop_scope=function tools/optimization/tests
    - name: Lint tool sources
      run: uvx ruff check tools/optimization
'on':
  push:
    branches:
    - main
  pull_request:
    paths:
    - packages/aiogram-kit/**
    - .github/**
    - tools/**
    - tests/integration/**
    - pyproject.toml
    - uv.lock
  workflow_dispatch: {}
