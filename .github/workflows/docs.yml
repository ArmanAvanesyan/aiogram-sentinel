name: Documentation
on:
  push:
    branches: [main]
    paths: ['docs/**', 'src/**', 'README.md', 'mkdocs.yml', 'pyproject.toml', 'uv.lock', '.github/workflows/docs.yml']
  pull_request:
    branches: [main]
    paths: ['docs/**', 'src/**', 'README.md', 'mkdocs.yml', 'pyproject.toml', 'uv.lock', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen --all-extras
      - run: uv run --no-sync mkdocs build --strict
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment: pages
    steps:
      - uses: actions/deploy-pages@v4
