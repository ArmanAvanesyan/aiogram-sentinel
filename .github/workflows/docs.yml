name: Documentation

on:
  push:
    branches: [main, 'chore/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the verified site to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - run: uv sync --frozen --all-extras --all-groups
      - run: uv run --frozen mkdocs build --strict
      - uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: site/
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
        with:
          path: site/

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: pages
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v5
