# Generated by tools/port_ci.py; originals remain preservation inputs.
name: 'aiogram-coordination: CI'
permissions:
  contents: read
concurrency:
  group: aiogram-coordination-ci-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        path: monorepo-source
        persist-credentials: false
    - name: Stage isolated distribution checkout
      working-directory: ${{ github.workspace }}
      shell: bash
      run: 'mkdir -p "$GITHUB_WORKSPACE/distribution"

        cp -a "$GITHUB_WORKSPACE/monorepo-source/packages/aiogram-coordination/." "$GITHUB_WORKSPACE/distribution/"'
    - uses: astral-sh/setup-uv@v6
      with:
        cache-dependency-glob: distribution/uv.lock
    - run: uv sync --frozen --extra redis --python 3.12
    - run: uv run --no-sync ruff check .
    - run: uv run --no-sync ruff format --check .
    - run: uv run --no-sync pyright src examples
    - run: uv run --no-sync python tools/check_version.py
    - run: uv run --no-sync towncrier build --draft
    - run: uv run --no-sync pytest
    - run: uv run --no-sync mkdocs build --strict
    - run: uv build
    - run: uv run --no-sync twine check dist/*
    - name: Independently install wheel and sdist without optional dependencies
      shell: bash
      run: "for artifact in dist/*.whl dist/*.tar.gz; do\n  target=$(mktemp -d)\n  uv venv --python 3.12 \"$target/env\"\n\
        \  uv pip install --python \"$target/env/bin/python\" \"$artifact\" pytest pytest-asyncio hypothesis\n  cp -R tests\
        \ examples tools \"$target/\"\n  cp pyproject.toml \"$target/\"\n  cd \"$target\"\n  \"$target/env/bin/python\" tools/check_install.py\n\
        \  \"$target/env/bin/python\" tools/check_version.py\n  \"$target/env/bin/python\" -m pytest -q\n  cd \"$GITHUB_WORKSPACE/distribution\"\
        \ndone\n"
    - uses: actions/upload-artifact@v4
      with:
        name: distributions
        path: distribution/dist/*
        if-no-files-found: error
    defaults:
      run:
        working-directory: distribution
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'
        aiogram:
        - minimum
        - latest
        exclude:
        - python: '3.14'
          aiogram: minimum
    steps:
    - uses: actions/checkout@v7
      with:
        path: monorepo-source
        persist-credentials: false
    - name: Stage isolated distribution checkout
      working-directory: ${{ github.workspace }}
      shell: bash
      run: 'mkdir -p "$GITHUB_WORKSPACE/distribution"

        cp -a "$GITHUB_WORKSPACE/monorepo-source/packages/aiogram-coordination/." "$GITHUB_WORKSPACE/distribution/"'
    - uses: astral-sh/setup-uv@v6
      with:
        cache-dependency-glob: distribution/uv.lock
    - run: uv sync --frozen --python '${{ matrix.python }}'
    - shell: bash
      run: "if [ '${{ matrix.aiogram }}' = minimum ]; then\n  uv pip install 'aiogram==3.22.0'\nelse\n  uv pip install --upgrade\
        \ 'aiogram>=3.22,<4'\nfi\n"
    - run: uv run --no-sync pytest
    - run: uv run --no-sync python examples/memory_scope.py
    defaults:
      run:
        working-directory: distribution
  redis:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
        - '3.10'
        - '3.12'
        - '3.14'
        redis-client:
        - minimum
        - latest
        server:
        - '7'
        include:
        - python: '3.12'
          redis-client: latest
          server: '8'
    services:
      redis:
        image: redis:${{ matrix.server }}-alpine
        ports:
        - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      AIOGRAM_COORDINATION_REDIS_URL: redis://localhost:6379/0
      AIOGRAM_COORDINATION_REQUIRE_REDIS: '1'
    steps:
    - uses: actions/checkout@v7
      with:
        path: monorepo-source
        persist-credentials: false
    - name: Stage isolated distribution checkout
      working-directory: ${{ github.workspace }}
      shell: bash
      run: 'mkdir -p "$GITHUB_WORKSPACE/distribution"

        cp -a "$GITHUB_WORKSPACE/monorepo-source/packages/aiogram-coordination/." "$GITHUB_WORKSPACE/distribution/"'
    - uses: astral-sh/setup-uv@v6
      with:
        cache-dependency-glob: distribution/uv.lock
    - run: uv sync --frozen --extra redis --python '${{ matrix.python }}'
    - if: matrix.redis-client == 'minimum'
      run: uv pip install 'redis==5.0.8'
    - run: uv run --no-sync pytest --cov=aiogram_coordination --cov-report=term-missing --cov-report=xml --cov-fail-under=80
    - name: Verify Redis-enabled installed artifacts against the real server
      if: matrix.python == '3.12' && matrix.redis-client == 'latest' && matrix.server == '7'
      shell: bash
      run: "uv build\nfor artifact in dist/*.whl dist/*.tar.gz; do\n  target=$(mktemp -d)\n  uv venv --python 3.12 \"$target/env\"\
        \n  uv pip install --python \"$target/env/bin/python\" \"${artifact}[redis]\" pytest pytest-asyncio hypothesis\n \
        \ cp -R tests examples tools \"$target/\"\n  cp pyproject.toml \"$target/\"\n  cd \"$target\"\n  \"$target/env/bin/python\"\
        \ tools/check_install.py --redis\n  \"$target/env/bin/python\" -m pytest -q\n  cd \"$GITHUB_WORKSPACE/distribution\"\
        \ndone\n"
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: redis-coverage-${{ matrix.python }}-${{ matrix.redis-client }}-${{ matrix.server }}
        path: distribution/coverage.xml
        if-no-files-found: warn
    defaults:
      run:
        working-directory: distribution
  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        path: monorepo-source
        persist-credentials: false
    - name: Stage isolated distribution checkout
      working-directory: ${{ github.workspace }}
      shell: bash
      run: 'mkdir -p "$GITHUB_WORKSPACE/distribution"

        cp -a "$GITHUB_WORKSPACE/monorepo-source/packages/aiogram-coordination/." "$GITHUB_WORKSPACE/distribution/"'
    - uses: astral-sh/setup-uv@v6
      with:
        cache-dependency-glob: distribution/uv.lock
    - run: uv sync --frozen --extra redis --python 3.12
    - run: uv run --no-sync bandit -r src -f json -o bandit-report.json --exit-zero
    - run: uv run --no-sync bandit -r src -ll
    - name: Audit the resolved environment
      if: always()
      run: uv run --no-sync pip-audit --format=json --output=pip-audit-report.json
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: 'distribution/bandit-report.json

          distribution/pip-audit-report.json'
        if-no-files-found: warn
    defaults:
      run:
        working-directory: distribution
  checks:
    name: Required checks
    if: always()
    needs:
    - quality
    - compatibility
    - redis
    - security
    runs-on: ubuntu-latest
    steps:
    - name: Require successful jobs
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: "python - <<'PY'\nimport json\nimport os\nresults = json.loads(os.environ[\"RESULTS\"])\nfailed = [name for name,\
        \ job in results.items() if job[\"result\"] != \"success\"]\nif failed:\n    raise SystemExit(\"Required jobs did\
        \ not pass: \" + \", \".join(failed))\nPY\n"
'on':
  push:
    branches:
    - main
    tags:
    - aiogram-coordination-v*
  pull_request:
    paths:
    - packages/aiogram-coordination/**
    - .github/**
    - tools/**
    - tests/integration/**
    - pyproject.toml
    - uv.lock
  workflow_dispatch: {}
