name: CI

on:
  push:
    branches: [main, 'chore/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - run: uv sync --frozen --all-extras --all-groups
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pyright
      - run: uv run --frozen python tools/check_version_tag.py
      - run: uv run --frozen python examples/application_profiles.py --dry-run

  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --all-extras --all-groups
      - run: uv run --frozen pytest tests/unit tests/integration --cov=aiogram_cmds --cov-report=xml:reports/coverage/coverage.xml --cov-fail-under=80
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.python }}
          path: reports/coverage/coverage.xml
          if-no-files-found: warn

  platform-tests:
    name: ${{ matrix.os }} / ${{ matrix.python }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --all-extras --all-groups
      - run: uv run --frozen pytest tests/unit tests/integration

  pypy-tests:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 'pypy3.10'
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --all-extras --all-groups --python pypy3.10
      - run: uv run --frozen pytest tests/unit tests/integration

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - run: uv sync --frozen --all-extras --all-groups
      - name: Static security analysis
        run: |
          mkdir -p reports/security
          uv run --frozen bandit -c pyproject.toml -r src -f json -o reports/security/bandit-report.json
      - name: Audit installed dependencies
        if: '!cancelled()'
        run: |
          mkdir -p reports/security
          uv run --frozen pip-audit --skip-editable --format json --output reports/security/pip-audit-report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-reports
          path: reports/security/*.json
          if-no-files-found: warn

  artifacts:
    name: Artifacts Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            aiogram: 'aiogram==3.0.0'
            asyncio: 'pytest-asyncio<1'
          - python: '3.12'
            aiogram: 'aiogram>=3,<4'
            asyncio: 'pytest-asyncio'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --all-extras --all-groups
      - run: uv build
      - run: uv run --frozen twine check dist/*
      - name: Verify independent wheel and sdist without optional packages
        shell: bash
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            target=$(mktemp -d)
            uv venv "$target/env" --python '${{ matrix.python }}'
            uv pip install --python "$target/env/bin/python" "$artifact" '${{ matrix.aiogram }}' pytest '${{ matrix.asyncio }}' pytest-mock babel tomli hypothesis
            uv pip check --python "$target/env/bin/python"
            cp -R tests examples "$target/"
            cp pyproject.toml "$target/"
            (cd "$target" && "$target/env/bin/python" -I -c 'from importlib.metadata import version; from importlib.resources import files; import importlib.util; import aiogram_cmds; assert aiogram_cmds.__version__ == version("aiogram-cmds"); assert files("aiogram_cmds").joinpath("py.typed").is_file(); assert importlib.util.find_spec("redis") is None; assert importlib.util.find_spec("aiogram_idle") is None; assert importlib.util.find_spec("aiogram_nav") is None')
            (cd "$target" && "$target/env/bin/python" -m pytest tests/unit tests/integration)
            (cd "$target" && "$target/env/bin/python" examples/application_profiles.py --dry-run)
          done
      - uses: actions/upload-artifact@v7
        with:
          name: distributions-${{ matrix.python }}
          path: dist/*

  aiogram-compatibility:
    name: aiogram ${{ matrix.aiogram }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        aiogram: ['aiogram==3.0.0', 'aiogram>=3,<4']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.10'
      - run: uv venv --python 3.10
      - run: uv pip install -e '.[dev]' '${{ matrix.aiogram }}'
      - run: .venv/bin/python -m pytest tests/unit tests/integration

  performance:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - run: uv sync --frozen --all-extras --all-groups
      - run: uv run --frozen pytest tests/perf --benchmark-json=reports/benchmark-results.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-results
          path: reports/benchmark-results.json
          if-no-files-found: warn
