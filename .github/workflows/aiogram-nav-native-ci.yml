# Generated by tools/port_ci.py; originals remain preservation inputs.
name: 'aiogram-nav: Native companion verification'
permissions:
  contents: read
concurrency:
  group: aiogram-nav-native-ci-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  wheels:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
        - os: ubuntu-latest
          target: x86_64
          manylinux: '2014'
        - os: ubuntu-24.04-arm
          target: aarch64
          manylinux: '2014'
        - os: ubuntu-latest
          target: x86_64-unknown-linux-musl
          manylinux: musllinux_1_2
        - os: ubuntu-24.04-arm
          target: aarch64-unknown-linux-musl
          manylinux: musllinux_1_2
        - os: macos-15-intel
          target: x86_64
          manylinux: auto
        - os: macos-latest
          target: aarch64
          manylinux: auto
        - os: windows-latest
          target: x86_64
          manylinux: auto
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
        path: monorepo-source
    - name: Stage isolated distribution checkout
      working-directory: ${{ github.workspace }}
      shell: bash
      run: 'mkdir -p "$GITHUB_WORKSPACE/distribution"

        cp -a "$GITHUB_WORKSPACE/monorepo-source/packages/aiogram-nav/." "$GITHUB_WORKSPACE/distribution/"'
    - uses: PyO3/maturin-action@v1
      with:
        target: ${{ matrix.target }}
        manylinux: ${{ matrix.manylinux }}
        args: --release --locked --manifest-path native/Cargo.toml --out native-dist
        working-directory: distribution
    - uses: astral-sh/setup-uv@v7
      with:
        cache-dependency-glob: distribution/uv.lock
    - shell: bash
      run: uvx abi3audit --strict native-dist/*.whl
    - name: Exercise actual musl wheels on every supported regular CPython
      if: matrix.manylinux == 'musllinux_1_2'
      shell: bash
      run: "for version in 3.10 3.11 3.12 3.13 3.14; do\n  docker run --rm -v \"$PWD:/work\" -w /work \"python:$version-alpine\"\
        \ sh -c 'pip install native-dist/*.whl pytest hypothesis pytest-asyncio && python -m pytest -q -c native/pytest.ini\
        \ -o asyncio_mode=auto -o asyncio_default_fixture_loop_scope=function native/tests'\ndone\n"
    - uses: actions/upload-artifact@v7
      with:
        name: native-${{ matrix.os }}-${{ matrix.target }}
        path: distribution/native-dist/*.whl
        if-no-files-found: error
    defaults:
      run:
        working-directory: distribution
  runtime:
    needs: wheels
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        python:
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'
        os:
        - ubuntu-latest
        - ubuntu-24.04-arm
        - macos-15-intel
        - macos-latest
        - windows-latest
        include:
        - os: ubuntu-latest
          target: x86_64
        - os: ubuntu-24.04-arm
          target: aarch64
        - os: macos-15-intel
          target: x86_64
        - os: macos-latest
          target: aarch64
        - os: windows-latest
          target: x86_64
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
        path: monorepo-source
    - name: Stage isolated distribution checkout
      working-directory: ${{ github.workspace }}
      shell: bash
      run: 'mkdir -p "$GITHUB_WORKSPACE/distribution"

        cp -a "$GITHUB_WORKSPACE/monorepo-source/packages/aiogram-nav/." "$GITHUB_WORKSPACE/distribution/"'
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python }}
    - uses: astral-sh/setup-uv@v7
      with:
        cache-dependency-glob: distribution/uv.lock
    - uses: actions/download-artifact@v6
      with:
        name: native-${{ matrix.os }}-${{ matrix.target }}
        path: distribution/native-dist
    - name: Install and exercise the downloaded companion independently
      shell: bash
      run: 'python -m pip install native-dist/*.whl pytest hypothesis pytest-asyncio

        python -I -c ''import importlib.util; assert importlib.util.find_spec("aiogram_nav") is None; assert importlib.util.find_spec("aiogram_idle")
        is None; assert importlib.util.find_spec("redis") is None''

        python -m pytest -q -c native/pytest.ini -o asyncio_mode=auto -o asyncio_default_fixture_loop_scope=function native/tests

        '
    - name: Build and install the pure Python base wheel
      shell: bash
      run: "uv build --wheel --out-dir base-dist --python '${{ matrix.python }}'\nfor artifact in base-dist/*.whl; do\n  python\
        \ -m pip install \"${artifact}[redis]\"\ndone\npython -I -c 'import aiogram_nav as package; assert \"site-packages\"\
        \ in package.__file__'\n"
    - name: Check the installed base/native boundary
      run: python -m pytest -q -c native/pytest.ini -o asyncio_mode=auto -o asyncio_default_fixture_loop_scope=function tests/test_engine.py
        tests/test_atomic_adoption.py tests/test_format3_parity.py
    defaults:
      run:
        working-directory: distribution
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
        path: monorepo-source
    - name: Stage isolated distribution checkout
      working-directory: ${{ github.workspace }}
      shell: bash
      run: 'mkdir -p "$GITHUB_WORKSPACE/distribution"

        cp -a "$GITHUB_WORKSPACE/monorepo-source/packages/aiogram-nav/." "$GITHUB_WORKSPACE/distribution/"'
    - uses: dtolnay/rust-toolchain@stable
    - run: cargo fmt --manifest-path native/Cargo.toml --check
    - run: cargo test --locked --manifest-path native/Cargo.toml
    - run: cargo clippy --locked --manifest-path native/Cargo.toml --all-targets -- -D warnings
    - run: cargo bench --locked --manifest-path native/Cargo.toml --no-run
    defaults:
      run:
        working-directory: distribution
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
        path: monorepo-source
    - name: Stage isolated distribution checkout
      working-directory: ${{ github.workspace }}
      shell: bash
      run: 'mkdir -p "$GITHUB_WORKSPACE/distribution"

        cp -a "$GITHUB_WORKSPACE/monorepo-source/packages/aiogram-nav/." "$GITHUB_WORKSPACE/distribution/"'
    - uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.12'
        cache-dependency-glob: distribution/uv.lock
    - uses: dtolnay/rust-toolchain@stable
    - run: uvx maturin sdist --manifest-path native/Cargo.toml --out native-dist
    - name: Rebuild the extracted source distribution and test its installed companion
      run: 'uv venv --python 3.12 source-env

        uv pip install --python source-env/bin/python native-dist/*.tar.gz pytest hypothesis pytest-asyncio

        source-env/bin/python -m pytest -q -c native/pytest.ini -o asyncio_mode=auto -o asyncio_default_fixture_loop_scope=function
        native/tests

        '
    - uses: actions/upload-artifact@v7
      with:
        name: native-source
        path: distribution/native-dist/*.tar.gz
        if-no-files-found: error
    defaults:
      run:
        working-directory: distribution
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python:
        - '3.10'
        - '3.12'
        - '3.14'
        redis:
        - '7'
        include:
        - python: '3.12'
          redis: '8'
    services:
      redis:
        image: redis:${{ matrix.redis }}-alpine
        ports:
        - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      AIOGRAM_NAV_REDIS_URL: redis://localhost:6379/0
      AIOGRAM_NAV_REQUIRE_REDIS: '1'
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
        path: monorepo-source
    - name: Stage isolated distribution checkout
      working-directory: ${{ github.workspace }}
      shell: bash
      run: 'mkdir -p "$GITHUB_WORKSPACE/distribution"

        cp -a "$GITHUB_WORKSPACE/monorepo-source/packages/aiogram-nav/." "$GITHUB_WORKSPACE/distribution/"'
    - uses: astral-sh/setup-uv@v7
      with:
        cache-dependency-glob: distribution/uv.lock
    - uses: dtolnay/rust-toolchain@stable
    - run: uv sync --frozen --extra redis --python '${{ matrix.python }}'
    - name: Install matching monorepo peer artifacts
      run: 'uv build --wheel --no-sources --project "$GITHUB_WORKSPACE/monorepo-source/packages/aiogram-coordination" --out-dir
        "$RUNNER_TEMP/peer-wheels/aiogram-coordination"

        uv pip install --no-deps "$RUNNER_TEMP/peer-wheels/aiogram-coordination/"*.whl'
    - run: uvx maturin build --manifest-path native/Cargo.toml --release --locked --out native-dist
    - run: uv pip install native-dist/*.whl
    - run: uv run --no-sync pytest -q native/tests tests/test_engine.py tests/test_atomic_adoption.py tests/test_format3_parity.py
        tests/test_redis_format3.py
    - name: Existing crash, callback, transport and FSM corpus on format three Rust
      run: uv run --no-sync python -m pytest -p tests.profile3_plugin --nav-engine=rust tests/test_redis_recovery.py tests/test_redis_dispatcher.py
        tests/test_redis_fsm.py tests/test_redis_review_fsm.py tests/test_redis_review_controls.py tests/test_redis_review_transport.py
        tests/test_redis_operations.py
    defaults:
      run:
        working-directory: distribution
'on':
  push:
    branches:
    - main
    tags:
    - aiogram-nav-native-v*
  pull_request:
    paths:
    - packages/aiogram-nav/**
    - .github/**
    - tools/**
    - tests/integration/**
    - pyproject.toml
    - uv.lock
    - packages/aiogram-coordination/**
  workflow_dispatch: {}
