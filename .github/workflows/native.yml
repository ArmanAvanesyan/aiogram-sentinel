name: Native candidate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  wheels:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64, manylinux: '2014'}
          - {os: ubuntu-24.04-arm, target: aarch64, manylinux: '2014'}
          - {os: ubuntu-latest, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2}
          - {os: macos-15-intel, target: x86_64, manylinux: auto}
          - {os: macos-latest, target: aarch64, manylinux: auto}
          - {os: windows-latest, target: x86_64, manylinux: auto}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --manifest-path native/Cargo.toml --out native-dist
      - if: matrix.manylinux == 'musllinux_1_2'
        shell: bash
        run: |
          for version in 3.10 3.11 3.12 3.13 3.14; do
            docker run --rm -v "$PWD:/work" -w /work "python:$version-alpine" sh -c 'pip install native-dist/*.whl && python tools/smoke_native.py'
          done
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.os }}-${{ matrix.target }}
          path: native-dist/*.whl
  runtime:
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest, windows-latest]
        include:
          - {os: ubuntu-latest, target: x86_64}
          - {os: ubuntu-24.04-arm, target: aarch64}
          - {os: macos-15-intel, target: x86_64}
          - {os: macos-latest, target: aarch64}
          - {os: windows-latest, target: x86_64}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: native-${{ matrix.os }}-${{ matrix.target }}
          path: native-dist
      - run: uv sync --frozen --all-extras --all-groups
      - run: uv pip install native-dist/*.whl
        shell: bash
      - run: uv run --no-sync python tools/smoke_native.py
      - run: uv run --no-sync pytest tests/unit tests/integration --cov=aiogram_cmds --cov-fail-under=80
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --locked --manifest-path native/Cargo.toml
      - run: cargo clippy --locked --manifest-path native/Cargo.toml --all-targets -- -D warnings
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --manifest-path native/Cargo.toml --out native-dist
      - uses: actions/upload-artifact@v7
        with:
          name: native-source
          path: native-dist/*.tar.gz
