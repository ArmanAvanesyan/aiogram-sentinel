# Generated by tools/port_ci.py; package originals remain preservation inputs.
name: 'aiogram-cmds: CI'
permissions:
  contents: read
concurrency:
  group: aiogram-cmds-ci-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6
      with:
        path: monorepo-source
        persist-credentials: false
    - name: Stage isolated distribution checkout
      working-directory: ${{ github.workspace }}
      shell: bash
      run: 'mkdir -p "${GITHUB_WORKSPACE}"

        cp -a "$GITHUB_WORKSPACE/monorepo-source/packages/aiogram-cmds/." "${GITHUB_WORKSPACE}/"'
    - uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.12'
    - run: uv sync --frozen --all-extras --all-groups
    - run: uv run --frozen ruff check --extend-exclude monorepo-source .
    - run: uv run --frozen ruff format --check --extend-exclude monorepo-source .
    - run: uv run --frozen pyright
    - run: uv run --frozen python tools/check_version_tag.py
    - run: uv run --frozen python examples/application_profiles.py --dry-run
  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python:
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'
    steps:
    - uses: actions/checkout@v6
      with:
        path: monorepo-source
        persist-credentials: false
    - name: Stage isolated distribution checkout
      working-directory: ${{ github.workspace }}
      shell: bash
      run: 'mkdir -p "${GITHUB_WORKSPACE}"

        cp -a "$GITHUB_WORKSPACE/monorepo-source/packages/aiogram-cmds/." "${GITHUB_WORKSPACE}/"'
    - uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python }}
    - run: uv sync --frozen --all-extras --all-groups
    - run: uv run --frozen pytest tests/unit tests/integration --cov=aiogram_cmds --cov-report=xml:reports/coverage/coverage.xml
        --cov-fail-under=80
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: coverage-${{ matrix.python }}
        path: reports/coverage/coverage.xml
        if-no-files-found: warn
  platform-tests:
    name: ${{ matrix.os }} / ${{ matrix.python }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
        - macos-latest
        - windows-latest
        python:
        - '3.10'
        - '3.13'
    steps:
    - uses: actions/checkout@v6
      with:
        path: monorepo-source
        persist-credentials: false
    - name: Stage isolated distribution checkout
      working-directory: ${{ github.workspace }}
      shell: bash
      run: 'mkdir -p "${GITHUB_WORKSPACE}"

        cp -a "$GITHUB_WORKSPACE/monorepo-source/packages/aiogram-cmds/." "${GITHUB_WORKSPACE}/"'
    - uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python }}
    - run: uv sync --frozen --all-extras --all-groups
    - run: uv run --frozen pytest tests/unit tests/integration
  pypy-tests:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6
      with:
        path: monorepo-source
        persist-credentials: false
    - name: Stage isolated distribution checkout
      working-directory: ${{ github.workspace }}
      shell: bash
      run: 'mkdir -p "${GITHUB_WORKSPACE}"

        cp -a "$GITHUB_WORKSPACE/monorepo-source/packages/aiogram-cmds/." "${GITHUB_WORKSPACE}/"'
    - uses: actions/setup-python@v6
      with:
        python-version: pypy3.10
    - uses: astral-sh/setup-uv@v7
    - run: uv sync --frozen --all-extras --all-groups --python pypy3.10
    - run: uv run --frozen pytest tests/unit tests/integration
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6
      with:
        path: monorepo-source
        persist-credentials: false
    - name: Stage isolated distribution checkout
      working-directory: ${{ github.workspace }}
      shell: bash
      run: 'mkdir -p "${GITHUB_WORKSPACE}"

        cp -a "$GITHUB_WORKSPACE/monorepo-source/packages/aiogram-cmds/." "${GITHUB_WORKSPACE}/"'
    - uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.12'
    - run: uv sync --frozen --all-extras --all-groups
    - name: Static security analysis
      run: 'mkdir -p reports/security

        uv run --frozen bandit -c pyproject.toml -r src -f json -o reports/security/bandit-report.json

        '
    - name: Audit installed dependencies
      if: '!cancelled()'
      run: 'mkdir -p reports/security

        uv run --frozen pip-audit --skip-editable --format json --output reports/security/pip-audit-report.json

        '
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: security-reports
        path: reports/security/*.json
        if-no-files-found: warn
  artifacts:
    name: Artifacts Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
        - python: '3.10'
          aiogram: aiogram==3.0.0
          asyncio: pytest-asyncio<1
        - python: '3.12'
          aiogram: aiogram>=3,<4
          asyncio: pytest-asyncio
    steps:
    - uses: actions/checkout@v6
      with:
        path: monorepo-source
        persist-credentials: false
    - name: Stage isolated distribution checkout
      working-directory: ${{ github.workspace }}
      shell: bash
      run: 'mkdir -p "${GITHUB_WORKSPACE}"

        cp -a "$GITHUB_WORKSPACE/monorepo-source/packages/aiogram-cmds/." "${GITHUB_WORKSPACE}/"'
    - uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python }}
    - run: uv sync --frozen --all-extras --all-groups
    - run: uv build
    - run: uv run --frozen twine check dist/*
    - name: Verify independent wheel and sdist without optional packages
      shell: bash
      run: "for artifact in dist/*.whl dist/*.tar.gz; do\n  target=$(mktemp -d)\n  uv venv \"$target/env\" --python '${{ matrix.python\
        \ }}'\n  uv pip install --python \"$target/env/bin/python\" \"$artifact\" '${{ matrix.aiogram }}' pytest '${{ matrix.asyncio\
        \ }}' pytest-mock babel tomli hypothesis\n  uv pip check --python \"$target/env/bin/python\"\n  cp -R tests examples\
        \ \"$target/\"\n  cp pyproject.toml \"$target/\"\n  (cd \"$target\" && \"$target/env/bin/python\" -I -c 'from importlib.metadata\
        \ import version; from importlib.resources import files; import importlib.util; import aiogram_cmds; assert aiogram_cmds.__version__\
        \ == version(\"aiogram-cmds\"); assert files(\"aiogram_cmds\").joinpath(\"py.typed\").is_file(); assert importlib.util.find_spec(\"\
        redis\") is None; assert importlib.util.find_spec(\"aiogram_idle\") is None; assert importlib.util.find_spec(\"aiogram_nav\"\
        ) is None')\n  (cd \"$target\" && \"$target/env/bin/python\" -m pytest tests/unit tests/integration)\n  (cd \"$target\"\
        \ && \"$target/env/bin/python\" examples/application_profiles.py --dry-run)\ndone\n"
    - uses: actions/upload-artifact@v6
      with:
        name: distributions-${{ matrix.python }}
        path: dist/*
  aiogram-compatibility:
    name: aiogram ${{ matrix.aiogram }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        aiogram:
        - aiogram==3.0.0
        - aiogram>=3,<4
    steps:
    - uses: actions/checkout@v6
      with:
        path: monorepo-source
        persist-credentials: false
    - name: Stage isolated distribution checkout
      working-directory: ${{ github.workspace }}
      shell: bash
      run: 'mkdir -p "${GITHUB_WORKSPACE}"

        cp -a "$GITHUB_WORKSPACE/monorepo-source/packages/aiogram-cmds/." "${GITHUB_WORKSPACE}/"'
    - uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.10'
    - run: uv venv --python 3.10
    - run: uv pip install -e '.[dev]' '${{ matrix.aiogram }}'
    - run: .venv/bin/python -m pytest tests/unit tests/integration
  performance:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6
      with:
        path: monorepo-source
        persist-credentials: false
    - name: Stage isolated distribution checkout
      working-directory: ${{ github.workspace }}
      shell: bash
      run: 'mkdir -p "${GITHUB_WORKSPACE}"

        cp -a "$GITHUB_WORKSPACE/monorepo-source/packages/aiogram-cmds/." "${GITHUB_WORKSPACE}/"'
    - uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.12'
    - run: uv sync --frozen --all-extras --all-groups
    - run: uv run --frozen pytest tests/perf --benchmark-json=reports/benchmark-results.json
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: performance-results
        path: reports/benchmark-results.json
        if-no-files-found: warn
'on':
  push:
    branches:
    - main
  pull_request:
    paths:
    - packages/aiogram-cmds/**
    - .github/**
    - tools/**
    - tests/integration/**
    - pyproject.toml
    - uv.lock
  workflow_dispatch: {}
