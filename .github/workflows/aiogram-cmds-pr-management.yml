# Generated by tools/port_ci.py; package originals remain preservation inputs.
name: 'aiogram-cmds: Changelog'
permissions:
  contents: read
jobs:
  changelog:
    if: '!contains(github.event.pull_request.labels.*.name, ''skip news'')'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        persist-credentials: false
        path: monorepo-source
    - name: Stage isolated distribution checkout
      working-directory: ${{ github.workspace }}
      run: 'mkdir -p "${GITHUB_WORKSPACE}"

        cp -a "$GITHUB_WORKSPACE/monorepo-source/packages/aiogram-cmds/." "${GITHUB_WORKSPACE}/"'
    - uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.12'
    - name: Check fragments
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: uvx towncrier check --compare-with "$BASE_SHA"
'on':
  push:
    branches:
    - main
  pull_request:
    paths:
    - packages/aiogram-cmds/**
    - .github/**
    - tools/**
    - tests/integration/**
    - pyproject.toml
    - uv.lock
  workflow_dispatch: {}
