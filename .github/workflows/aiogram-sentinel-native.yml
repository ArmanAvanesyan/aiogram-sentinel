name: 'aiogram-sentinel: Native wheels'
permissions:
  contents: read
jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          target: x86_64-unknown-linux-gnu
          manylinux: '2_17'
        - os: ubuntu-24.04-arm
          target: aarch64-unknown-linux-gnu
          manylinux: '2_17'
        - os: ubuntu-latest
          target: x86_64-unknown-linux-musl
          manylinux: musllinux_1_2
        - os: ubuntu-24.04-arm
          target: aarch64-unknown-linux-musl
          manylinux: musllinux_1_2
        - os: macos-15-intel
          target: x86_64-apple-darwin
          manylinux: auto
        - os: macos-latest
          target: aarch64-apple-darwin
          manylinux: auto
        - os: windows-latest
          target: x86_64-pc-windows-msvc
          manylinux: auto
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
      with:
        path: monorepo-source
        persist-credentials: false
    - name: Stage isolated distribution checkout
      working-directory: ${{ github.workspace }}
      run: 'mkdir -p "${GITHUB_WORKSPACE}"

        cp -a "$GITHUB_WORKSPACE/monorepo-source/packages/aiogram-sentinel/." "${GITHUB_WORKSPACE}/"'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - uses: PyO3/maturin-action@v1
      with:
        command: build
        target: ${{ matrix.target }}
        manylinux: ${{ matrix.manylinux }}
        args: --release --locked --manifest-path native/Cargo.toml --out wheelhouse
    - if: matrix.manylinux != 'musllinux_1_2'
      run: python -m pip install ".[dev,redis]" wheelhouse/*.whl
      shell: bash
    - if: matrix.manylinux != 'musllinux_1_2'
      run: python -m pytest tests/unit/test_native.py
    - if: matrix.manylinux == 'musllinux_1_2'
      run: 'docker run --rm -v "$PWD:/work" -w /work python:3.12-alpine sh -c ''pip install wheelhouse/*.whl && python -c
        ''\''''import _aiogram_sentinel_native as n; assert n.capabilities() == ("aiogram-sentinel-native", 1, "1.3.0"); assert
        n.RateLimiterCore().allow(b"key",1,60,1)''\''''''

        '
    - uses: actions/upload-artifact@v4
      with:
        name: native-${{ matrix.target }}
        path: wheelhouse/*.whl
  rust:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        path: monorepo-source
        persist-credentials: false
    - name: Stage isolated distribution checkout
      working-directory: ${{ github.workspace }}
      run: 'mkdir -p "${GITHUB_WORKSPACE}"

        cp -a "$GITHUB_WORKSPACE/monorepo-source/packages/aiogram-sentinel/." "${GITHUB_WORKSPACE}/"'
    - uses: dtolnay/rust-toolchain@stable
    - run: cargo fmt --manifest-path native/Cargo.toml --check
    - run: cargo clippy --manifest-path native/Cargo.toml --all-targets -- -D warnings
    - run: cargo test --manifest-path native/Cargo.toml
  installed-python-matrix:
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        python:
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'
        os:
        - ubuntu-latest
        - ubuntu-24.04-arm
        - macos-15-intel
        - macos-latest
        - windows-latest
        include:
        - os: ubuntu-latest
          target: x86_64-unknown-linux-gnu
        - os: ubuntu-24.04-arm
          target: aarch64-unknown-linux-gnu
        - os: macos-15-intel
          target: x86_64-apple-darwin
        - os: macos-latest
          target: aarch64-apple-darwin
        - os: windows-latest
          target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
      with:
        path: monorepo-source
        persist-credentials: false
    - name: Stage isolated distribution checkout
      working-directory: ${{ github.workspace }}
      run: 'mkdir -p "${GITHUB_WORKSPACE}"

        cp -a "$GITHUB_WORKSPACE/monorepo-source/packages/aiogram-sentinel/." "${GITHUB_WORKSPACE}/"'
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    - uses: actions/download-artifact@v4
      with:
        name: native-${{ matrix.target }}
        path: wheelhouse
    - run: python -m pip install ".[dev,redis]" wheelhouse/*.whl
      shell: bash
    - run: python -m pytest tests/unit/test_native.py
  source:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        path: monorepo-source
        persist-credentials: false
    - name: Stage isolated distribution checkout
      working-directory: ${{ github.workspace }}
      run: 'mkdir -p "${GITHUB_WORKSPACE}"

        cp -a "$GITHUB_WORKSPACE/monorepo-source/packages/aiogram-sentinel/." "${GITHUB_WORKSPACE}/"'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: PyO3/maturin-action@v1
      with:
        command: sdist
        args: --manifest-path native/Cargo.toml --out wheelhouse
    - uses: actions/upload-artifact@v4
      with:
        name: native-source
        path: wheelhouse/*.tar.gz
