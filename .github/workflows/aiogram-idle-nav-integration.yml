# Generated by tools/port_ci.py; originals remain preservation inputs.
name: 'aiogram-idle: Optional navigation integration'
permissions:
  contents: read
concurrency:
  group: aiogram-idle-nav-integration-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  combined:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: aiogram-idle
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        python:
        - '3.12'
        redis:
        - '7'
        - '8'
        idle:
        - python
        - rust
        nav:
        - python
        - rust
        aiogram:
        - latest
        include:
        - python: '3.10'
          redis: '7'
          idle: python
          nav: python
          aiogram: minimum
        - python: '3.11'
          redis: '7'
          idle: python
          nav: python
          aiogram: latest
        - python: '3.13'
          redis: '7'
          idle: rust
          nav: rust
          aiogram: latest
        - python: '3.14'
          redis: '7'
          idle: rust
          nav: rust
          aiogram: latest
    services:
      redis:
        image: redis:${{ matrix.redis }}-alpine
        ports:
        - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      AIOGRAM_IDLE_REDIS_URL: redis://localhost:6379/0
      AIOGRAM_IDLE_REQUIRE_REDIS: '1'
    steps:
    - uses: actions/checkout@v7
      with:
        path: monorepo-source
        persist-credentials: false
    - name: Stage isolated distribution checkout
      working-directory: ${{ github.workspace }}
      shell: bash
      run: 'mkdir -p "$GITHUB_WORKSPACE/aiogram-idle"

        cp -a "$GITHUB_WORKSPACE/monorepo-source/packages/aiogram-idle/." "$GITHUB_WORKSPACE/aiogram-idle/"'
    - name: Stage matching Nav native source
      if: matrix.nav == 'rust'
      working-directory: ${{ github.workspace }}
      shell: bash
      run: cp -a "$GITHUB_WORKSPACE/monorepo-source/packages/aiogram-nav" "$GITHUB_WORKSPACE/nav-native-source"
    - uses: astral-sh/setup-uv@v7
      with:
        cache-dependency-glob: aiogram-idle/uv.lock
    - uses: dtolnay/rust-toolchain@stable
      if: matrix.idle == 'rust' || matrix.nav == 'rust'
    - run: uv sync --frozen --extra redis --extra nav --python '${{ matrix.python }}'
    - name: Install matching monorepo peer artifacts
      run: 'uv build --wheel --no-sources --project "$GITHUB_WORKSPACE/monorepo-source/packages/aiogram-coordination" --out-dir
        "$RUNNER_TEMP/peer-wheels/aiogram-coordination"

        uv pip install --no-deps "$RUNNER_TEMP/peer-wheels/aiogram-coordination/"*.whl

        uv build --wheel --no-sources --project "$GITHUB_WORKSPACE/monorepo-source/packages/aiogram-nav" --out-dir "$RUNNER_TEMP/peer-wheels/aiogram-nav"

        uv pip install --no-deps "$RUNNER_TEMP/peer-wheels/aiogram-nav/"*.whl'
    - name: Select the minimum aiogram endpoint
      if: matrix.aiogram == 'minimum'
      run: uv pip install 'aiogram==3.22.0'
    - name: Build and install the optional Idle core
      if: matrix.idle == 'rust'
      run: 'uvx maturin build --manifest-path native/Cargo.toml --release --locked --out native-dist

        uv pip install native-dist/*.whl

        '
    - name: Build and install the matching optional Nav core
      if: matrix.nav == 'rust'
      run: 'uvx maturin build --manifest-path ../nav-native-source/native/Cargo.toml --release --locked --out nav-native-dist

        uv pip install nav-native-dist/*.whl

        '
    - run: uv run --no-sync pyright --project pyright-nav.json
    - name: Existing optional integration recovery and FSM corpus on format three
      run: uv run --no-sync python -m tests.profile_format3 --combined-only --engine '${{ matrix.idle }}' --nav-engine '${{
        matrix.nav }}' --manifest combined-profile.json -q
    - name: Canonical host, migration and collection regressions
      run: uv run --no-sync pytest -q tests/test_nav_canonical.py tests/test_canonical_components.py tests/test_canonical_redis.py
        tests/test_canonical_gc.py tests/test_cold_migration.py
    - name: Check optional example without sending Telegram messages
      run: uv run --no-sync python examples/navigation.py --help
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: combined-profile-${{ matrix.python }}-${{ matrix.redis }}-${{ matrix.idle }}-${{ matrix.nav }}-${{ matrix.aiogram
          }}
        path: aiogram-idle/combined-profile.json
        if-no-files-found: error
'on':
  push:
    branches:
    - main
    tags:
    - aiogram-coordination-v*
    - aiogram-nav-v*
    - aiogram-idle-v*
  pull_request:
    paths:
    - packages/aiogram-idle/**
    - .github/**
    - tools/**
    - tests/integration/**
    - pyproject.toml
    - uv.lock
    - packages/aiogram-coordination/**
    - packages/aiogram-nav/**
  workflow_dispatch: {}
