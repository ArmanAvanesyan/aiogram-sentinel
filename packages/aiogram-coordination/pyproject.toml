[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aiogram-coordination"
version = "0.1.1"
description = "Task-scoped ownership, renewable coordination and session authority contracts for aiogram"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "aiogram-coordination contributors"}]
dependencies = ["aiogram>=3.22,<4"]
classifiers = ["Development Status :: 3 - Alpha", "Framework :: AsyncIO", "Typing :: Typed", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14"]
[project.urls]
Homepage = "https://github.com/ArmanAvanesyan/aiogram-kit/tree/main/packages/aiogram-coordination"
Repository = "https://github.com/ArmanAvanesyan/aiogram-kit"
Issues = "https://github.com/ArmanAvanesyan/aiogram-kit/issues"
Documentation = "https://armanavanesyan.github.io/aiogram-kit/libraries/aiogram-coordination/"
Changelog = "https://github.com/ArmanAvanesyan/aiogram-kit/blob/main/packages/aiogram-coordination/CHANGELOG.md"

[project.optional-dependencies]
redis = ["redis>=5.0.8,<8"]
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=6", "ruff>=0.11", "pyright>=1.1.400", "build>=1.2", "twine>=6", "bandit>=1.8", "pip-audit>=2.9; python_version>='3.11'", "mkdocs>=1.6,<2", "mkdocs-material>=9.6,<10", "towncrier>=24.8", "tomli>=2; python_version<'3.11'"]
[tool.hatch.build.targets.wheel]
packages = ["src/aiogram_coordination"]
[tool.ruff]
target-version = "py310"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
[tool.pyright]
include = ["src", "examples"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
[tool.coverage.run]
source = ["aiogram_coordination"]
branch = true
[tool.coverage.report]
show_missing = true
fail_under = 80
[tool.towncrier]
package = "aiogram_coordination"
package_dir = "src"
directory = "CHANGES"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## {version} ({project_date})"
underlines = ["", "", ""]
[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true
[[tool.towncrier.type]]
directory = "bugfix"
name = "Bugfixes"
showcontent = true
[[tool.towncrier.type]]
directory = "doc"
name = "Documentation"
showcontent = true
[[tool.towncrier.type]]
directory = "removal"
name = "Removals"
showcontent = true
[[tool.towncrier.type]]
directory = "misc"
name = "Miscellaneous"
showcontent = true
