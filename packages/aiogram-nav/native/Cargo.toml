[package]
name = "aiogram-nav-native"
version = "0.3.1"
edition = "2021"
license = "MIT"
description = "Optional deterministic Rust core for aiogram-nav"
repository = "https://github.com/ArmanAvanesyan/aiogram-nav"
homepage = "https://github.com/ArmanAvanesyan/aiogram-nav"

[lib]
name = "_aiogram_nav_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.25", features = ["abi3-py310"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
sha2 = "0.10"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "core"
harness = false
