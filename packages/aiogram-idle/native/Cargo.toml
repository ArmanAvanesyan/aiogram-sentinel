[package]
name = "aiogram-idle-native"
version = "0.3.1"
edition = "2021"
license = "MIT"
description = "Optional deterministic Rust core for aiogram-idle"
repository = "https://github.com/ArmanAvanesyan/aiogram-kit"

[lib]
name = "_aiogram_idle_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.25", features = ["abi3-py310"] }
sha2 = "0.11"
num-bigint = "0.4"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "core"
harness = false
