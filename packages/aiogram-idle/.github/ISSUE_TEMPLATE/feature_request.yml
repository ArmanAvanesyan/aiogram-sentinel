name: Feature request
description: Propose an aiogram-idle improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain the use case and current limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the public behavior and alternatives considered.
    validations:
      required: true
