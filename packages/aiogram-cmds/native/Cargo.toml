[package]
name = "aiogram-cmds-native"
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[lib]
name = "_aiogram_cmds_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"

[dev-dependencies]
criterion = "0.7"

[[bench]]
name = "core"
harness = false
