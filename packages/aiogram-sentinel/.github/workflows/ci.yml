name: CI
on:
  push:
    branches: [main, 'chore/**']
  workflow_dispatch:
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - run: uv sync --frozen --all-extras
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync black --check src tests
      - run: uv run --no-sync pyright
      - run: uv run --no-sync mkdocs build --strict
  tests:
    name: Tests (Python ${{ matrix.python }}, aiogram ${{ matrix.aiogram }}, ${{ matrix.redis-server }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        aiogram: ['latest']
        redis-server: ['redis:7-alpine']
        include:
          - python: '3.10'
            aiogram: '3.0.0'
            redis-server: 'redis:7-alpine'
          - python: '3.12'
            aiogram: 'latest'
            redis-server: 'redis:8-alpine'
    services:
      redis:
        image: ${{ matrix.redis-server }}
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_REDIS_URL: redis://localhost:6379/15
      REQUIRE_REDIS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv venv .test-venv
      - if: matrix.aiogram != 'latest'
        # aiogram 3.0 requires typing-extensions <4.8; modern pytest-asyncio
        # imports TypeIs. Solve the complete compatible test graph together.
        run: uv pip install --python .test-venv/bin/python '.[dev,redis,sentry]' 'aiogram==${{ matrix.aiogram }}' 'pytest-asyncio<1'
      - if: matrix.aiogram == 'latest'
        run: uv pip install --python .test-venv/bin/python '.[dev,redis,sentry]' 'aiogram<4'
      - if: matrix.python == '3.12' && matrix.aiogram == 'latest'
        run: uv pip install --python .test-venv/bin/python 'redis==5.0.8'
      - run: .test-venv/bin/python -m pytest tests/unit tests/integration --cov=aiogram_sentinel --cov-report=term-missing --cov-fail-under=80
  changelog:
    name: Changelog fragment
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip news')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - run: uv sync --frozen --all-extras
      - name: Check changelog against the pull request base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: uv run --no-sync towncrier check --compare-with "$BASE_SHA"
  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - run: uv sync --frozen --all-extras
      - name: Scan library source
        run: uv run --no-sync bandit -r src -c pyproject.toml -f json -o bandit-report.json
      - name: Audit installed runtime and development dependencies
        if: always()
        run: uv run --no-sync pip-audit --format json --output pip-audit-report.json
      - name: Upload scan evidence, including failed scans
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
          if-no-files-found: error
  build:
    name: Distribution and base install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - run: uv build
      - run: uvx twine check dist/*
      - run: uv venv /tmp/sentinel-base
      - run: uv pip install --python /tmp/sentinel-base/bin/python dist/*.whl
      - run: /tmp/sentinel-base/bin/python tools/check_install.py
      - run: uv venv /tmp/sentinel-sdist
      - run: uv pip install --python /tmp/sentinel-sdist/bin/python dist/*.tar.gz
      - run: /tmp/sentinel-sdist/bin/python tools/check_install.py
  required:
    name: Required Checks
    if: always()
    needs: [quality-checks, tests, build, security, changelog]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs passed
        env:
          QUALITY: ${{ needs.quality-checks.result }}
          TESTS: ${{ needs.tests.result }}
          BUILD: ${{ needs.build.result }}
          SECURITY: ${{ needs.security.result }}
          CHANGELOG: ${{ needs.changelog.result }}
        run: |
          test "$QUALITY" = success
          test "$TESTS" = success
          test "$BUILD" = success
          test "$SECURITY" = success
          test "$CHANGELOG" = success || test "$CHANGELOG" = skipped
