[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "aiogram-sentinel-native"
version = "1.3.0"
description = "Optional ABI1 memory kernels for aiogram-sentinel"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: 3"]

[project.urls]
Repository = "https://github.com/ArmanAvanesyan/aiogram-sentinel"

[tool.maturin]
module-name = "_aiogram_sentinel_native"
features = ["pyo3/extension-module"]
include = [{ path = "LICENSE", format = "sdist" }]
