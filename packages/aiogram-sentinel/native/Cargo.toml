[package]
name = "aiogram-sentinel-native"
version = "1.3.1"
edition = "2024"
rust-version = "1.86"
license = "MIT"
description = "Optional ABI1 memory kernels for aiogram-sentinel"
repository = "https://github.com/ArmanAvanesyan/aiogram-kit"

[lib]
name = "_aiogram_sentinel_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "memory"
harness = false
